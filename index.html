<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shorye IA</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zinc: {
                            850: '#141417',
                            900: '#18181b',
                            950: '#09090b',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Marked.js for Markdown & Highlight.js for Syntax Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #09090b;
            color: #fafafa;
        }

        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #09090b;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }

        .markdown-body pre {
            background-color: #141417 !important;
            border: 1px solid #27272a;
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
            overflow-x: auto;
            position: relative;
        }
        .markdown-body p {
            margin-bottom: 0.75rem;
            line-height: 1.6;
        }
        .markdown-body p:last-child {
            margin-bottom: 0;
        }
        .markdown-body ul {
            list-style-type: disc;
            margin-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .markdown-body ol {
            list-style-type: decimal;
            margin-left: 1.25rem;
            margin-bottom: 0.75rem;
        }
        .markdown-body code:not(pre code) {
            background-color: #27272a;
            padding: 0.2rem 0.4rem;
            border-radius: 0.375rem;
            font-size: 0.85em;
            color: #e4e4e7;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-weight: 700;
            color: #ffffff;
            margin-top: 1.25rem;
            margin-bottom: 0.5rem;
        }
        .markdown-body h1 { font-size: 1.25rem; }
        .markdown-body h2 { font-size: 1.1rem; }
        .markdown-body h3 { font-size: 1rem; }

        .code-block-wrapper {
            position: relative;
            margin-top: 0.75rem;
            margin-bottom: 0.75rem;
        }
        .code-block-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1f1f23;
            border: 1px solid #27272a;
            border-bottom: none;
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.75rem;
            color: #a1a1aa;
            font-family: 'JetBrains Mono', monospace;
        }
        .code-block-wrapper pre {
            margin-top: 0 !important;
            border-top-left-radius: 0 !important;
            border-top-right-radius: 0 !important;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .dot-1 { animation: pulse-dot 1.2s infinite 0s; }
        .dot-2 { animation: pulse-dot 1.2s infinite 0.2s; }
        .dot-3 { animation: pulse-dot 1.2s infinite 0.4s; }
    </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col antialiased selection:bg-zinc-700 selection:text-white">

    <header class="bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 sticky top-0 z-30 px-4 py-3">
        <div class="max-w-6xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-xl bg-white text-zinc-950 flex items-center justify-center font-black text-lg shadow-lg">
                    S
                </div>
                <div>
                    <h1 class="font-bold text-base tracking-wider text-white flex items-center gap-2">
                        SHORYE <span class="text-xs bg-zinc-800 text-zinc-300 px-2 py-0.5 rounded-full border border-zinc-700 font-mono">IA</span>
                    </h1>
                    <p id="modeBadge" class="text-[11px] text-zinc-400 font-mono">Shorye Basic</p>
                </div>
            </div>

            <div class="hidden sm:flex items-center bg-zinc-950 p-1 rounded-xl border border-zinc-800 space-x-1">
                <button id="btn-mode-basic" data-mode="basic" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 bg-zinc-800 text-white shadow-sm">
                    <i class="fa-solid fa-bolt text-[10px]"></i> Basic
                </button>
                <button id="btn-mode-medium" data-mode="medium" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-white transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles text-[10px]"></i> Medium
                </button>
                <button id="btn-mode-pro" data-mode="pro" class="mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-white transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-code text-[10px]"></i> Pro
                </button>
            </div>

            <div class="flex items-center space-x-2">
                <select id="mobileModeSelect" class="sm:hidden bg-zinc-950 text-xs border border-zinc-800 rounded-lg px-2.5 py-1.5 text-zinc-200">
                    <option value="basic">Basic</option>
                    <option value="medium">Medium</option>
                    <option value="pro">Pro</option>
                </select>

                <button id="openKeyModal" title="Configurar Chave API Groq" class="p-2 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all relative">
                    <i class="fa-solid fa-key text-xs"></i>
                    <span id="keyStatusDot" class="absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-amber-500"></span>
                </button>

                <button id="clearChatBtn" title="Limpar Conversa" class="p-2 rounded-xl bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/60 transition-all">
                    <i class="fa-solid fa-trash-can text-xs"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col justify-between overflow-hidden">
        <div id="chatContainer" class="flex-1 overflow-y-auto space-y-4 pr-1 pb-4">
            <div id="welcomeScreen" class="py-10 text-center flex flex-col items-center justify-center min-h-[55vh]">
                <div class="w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center text-white text-2xl shadow-2xl mb-4">
                    <i class="fa-solid fa-cube"></i>
                </div>
                <h2 class="text-2xl font-bold mb-2 text-white">Shorye IA</h2>
                <p id="modeDescription" class="text-zinc-400 max-w-md text-xs mb-8 leading-relaxed">
                    Modo Basic: Respostas diretas, rápidas e simples sem enrolação.
                </p>
                <div id="presetContainer" class="grid grid-cols-1 sm:grid-cols-3 gap-3 w-full max-w-2xl text-left"></div>
            </div>
        </div>

        <div class="sticky bottom-0 pt-2 bg-zinc-950">
            <form id="chatForm" class="relative bg-zinc-900 rounded-2xl border border-zinc-800 overflow-hidden focus-within:border-zinc-500 transition-all shadow-2xl">
                <textarea 
                    id="userInput" 
                    rows="1" 
                    placeholder="Envie uma mensagem para o Shorye IA..." 
                    class="w-full px-4 py-3.5 pr-14 bg-transparent text-white placeholder-zinc-500 focus:outline-none resize-none max-h-36 text-sm"
                ></textarea>
                <button 
                    type="submit" 
                    id="sendBtn"
                    class="absolute right-2 bottom-2 p-2.5 rounded-xl bg-white hover:bg-zinc-200 text-zinc-950 disabled:opacity-30 disabled:hover:bg-white transition-all shadow-md font-bold"
                >
                    <i class="fa-solid fa-arrow-up text-xs"></i>
                </button>
            </form>
            <div class="flex items-center justify-between text-[10px] text-zinc-500 mt-2 px-1 font-mono">
                <span>Powered by Groq &bull; Llama 3.3</span>
                <span id="activeModelLabel">Model: llama-3.3-70b-versatile</span>
            </div>
        </div>
    </main>

    <div id="keyModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-zinc-900 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-zinc-800 space-y-4">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <i class="fa-solid fa-key text-zinc-400"></i> Configuração de API Key Groq
                </h3>
                <button id="closeKeyModal" class="text-zinc-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <p class="text-xs text-zinc-400 leading-relaxed">
                Insira sua chave de API pessoal da Groq (<code class="text-white">gsk_...</code>) obtida gratuitamente em <a href="https://console.groq.com" target="_blank" class="underline text-zinc-200">console.groq.com</a>.
            </p>
            <div>
                <label class="block text-[11px] font-semibold text-zinc-400 mb-1 uppercase tracking-wider">Chave API (Groq)</label>
                <input 
                    type="password" 
                    id="apiKeyInput" 
                    placeholder="gsk_..." 
                    class="w-full px-3.5 py-2.5 rounded-xl border border-zinc-800 bg-zinc-950 text-white text-xs focus:outline-none focus:border-zinc-500 transition-colors font-mono"
                />
            </div>
            <div class="flex gap-2 justify-end pt-2">
                <button id="saveKeyBtn" class="px-4 py-2 bg-white hover:bg-zinc-200 text-zinc-950 rounded-xl text-xs font-bold transition-colors">
                    Salvar Chave
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-20 right-5 bg-zinc-900 text-white border border-zinc-800 px-4 py-2.5 rounded-xl shadow-2xl text-xs flex items-center space-x-2 transition-all opacity-0 translate-y-4 pointer-events-none z-50">
        <i id="toastIcon" class="fa-solid fa-check text-zinc-400"></i>
        <span id="toastMsg">Notificação</span>
    </div>

    <script type="module">
        const MODES = {
            basic: {
                name: "Shorye Basic",
                model: "llama-3.3-70b-versatile",
                description: "Respostas diretas, rápidas e simples sem enrolação.",
                systemInstruction: "Você é o Shorye IA no modo Basic. Responda de forma rápida, curta, objetiva e clara em português do Brasil.",
                presets: [
                    { title: "Resumo Rápido", prompt: "Explique o que é Computação em Nuvem em apenas 3 frases simples.", icon: "fa-bolt" },
                    { title: "Pergunta Direta", prompt: "Quais são os 3 países mais populosos do mundo?", icon: "fa-circle-question" },
                    { title: "Dica do Dia", prompt: "Me dê uma dica rápida de produtividade.", icon: "fa-lightbulb" }
                ]
            },
            medium: {
                name: "Shorye Medium",
                model: "llama-3.3-70b-versatile", 
                description: "Inteligência analítica avançada e detalhada.",
                systemInstruction: "Você é o Shorye IA no modo Medium. Você possui raciocínio detalhado, capacidade de criar análises profundas e textos criativos em português do Brasil.",
                presets: [
                    { title: "Análise Profunda", prompt: "Faça uma comparação analítica detalhada entre Energia Solar e Energia Eólica.", icon: "fa-wand-magic-sparkles" },
                    { title: "Redação Criativa", prompt: "Escreva uma introdução cativante para um livro de ficção científica espacial.", icon: "fa-pen-nib" },
                    { title: "Explicar Conceito", prompt: "Como funcionam os algoritmos de inteligência artificial?", icon: "fa-brain" }
                ]
            },
            pro: {
                name: "Shorye Pro",
                model: "llama-3.3-70b-versatile",
                description: "Especialista em Programação C++, Arquitetura de Software e Aplicações Web.",
                systemInstruction: "Você é o Shorye IA no modo Pro, um Engenheiro de Software Sênior especializado em C++, desenvolvimento web completo (HTML5/CSS/JS) e arquitetura de sistemas. Responda em português do Brasil.",
                presets: [
                    { title: "C++ Avançado", prompt: "Escreva uma implementação em C++17 de uma Árvore AVL balanceada.", icon: "fa-code" },
                    { title: "Gerar App Web", prompt: "Crie o código de um aplicativo de Lista de Tarefas (Todo) em HTML com Tailwind CSS e JS.", icon: "fa-laptop-code" },
                    { title: "Arquitetura", prompt: "Explique como otimizar memória em C++ utilizando ponteiros inteligentes.", icon: "fa-layer-group" }
                ]
            }
        };

        let currentMode = 'basic';
        let customApiKey = localStorage.getItem('shorye_groq_api_key') || '';
        let chatHistory = JSON.parse(localStorage.getItem('shorye_groq_history_' + currentMode)) || [];
        let isGenerating = false;

        const chatContainer = document.getElementById('chatContainer');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const presetContainer = document.getElementById('presetContainer');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const clearChatBtn = document.getElementById('clearChatBtn');
        const modeBadge = document.getElementById('modeBadge');
        const modeDescription = document.getElementById('modeDescription');
        const activeModelLabel = document.getElementById('activeModelLabel');
        const keyStatusDot = document.getElementById('keyStatusDot');
        const mobileModeSelect = document.getElementById('mobileModeSelect');

        const keyModal = document.getElementById('keyModal');
        const openKeyModal = document.getElementById('openKeyModal');
        const closeKeyModal = document.getElementById('closeKeyModal');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const apiKeyInput = document.getElementById('apiKeyInput');

        const renderer = new marked.Renderer();
        renderer.code = function(code, language) {
            const validLang = hljs.getLanguage(language) ? language : 'plaintext';
            const highlighted = hljs.highlight(code, { language: validLang }).value;
            const codeId = 'code-' + Math.random().toString(36).substring(2, 9);
            
            // Armazena o código globalmente para o botão de copiar
            window[codeId] = code;

            return `
                <div class="code-block-wrapper">
                    <div class="code-block-header">
                        <span><i class="fa-solid fa-code text-[10px] mr-1"></i> ${validLang.toUpperCase()}</span>
                        <button type="button" data-copy-id="${codeId}" class="copy-code-btn hover:text-white transition-colors flex items-center gap-1 text-[11px]">
                            <i class="fa-regular fa-copy"></i> Copiar Código
                        </button>
                    </div>
                    <pre><code class="hljs language-${validLang}">${highlighted}</code></pre>
                </div>
            `;
        };
        marked.setOptions({ renderer });

        function sendPromptText(text) {
            userInput.value = text;
            chatForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
        }

        function setMode(modeKey) {
            if (!MODES[modeKey]) return;
            currentMode = modeKey;

            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.className = "mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold text-zinc-400 hover:text-white transition-all flex items-center gap-1.5";
            });
            const activeBtn = document.getElementById(`btn-mode-${modeKey}`);
            if (activeBtn) {
                activeBtn.className = "mode-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 bg-zinc-800 text-white shadow-sm border border-zinc-700/50";
            }
            if (mobileModeSelect) mobileModeSelect.value = modeKey;

            const modeInfo = MODES[modeKey];
            modeBadge.textContent = modeInfo.name;
            modeDescription.textContent = modeInfo.description;
            activeModelLabel.textContent = `Model: ${modeInfo.model}`;

            chatHistory = JSON.parse(localStorage.getItem('shorye_groq_history_' + currentMode)) || [];
            renderPresets(modeInfo.presets);
            renderChatHistory();
        }

        // Eventos dos botões de modo
        document.getElementById('btn-mode-basic').addEventListener('click', () => setMode('basic'));
        document.getElementById('btn-mode-medium').addEventListener('click', () => setMode('medium'));
        document.getElementById('btn-mode-pro').addEventListener('click', () => setMode('pro'));

        if (mobileModeSelect) {
            mobileModeSelect.addEventListener('change', (e) => setMode(e.target.value));
        }

        // Modal de Chave API
        openKeyModal.addEventListener('click', () => {
            apiKeyInput.value = customApiKey;
            keyModal.classList.remove('hidden');
        });

        closeKeyModal.addEventListener('click', () => {
            keyModal.classList.add('hidden');
        });

        saveKeyBtn.addEventListener('click', () => {
            const val = apiKeyInput.value.trim();
            customApiKey = val;
            localStorage.setItem('shorye_groq_api_key', val);
            updateKeyStatus();
            keyModal.classList.add('hidden');
            showToast('Chave API da Groq salva!');
        });

        // Limpar Conversa
        clearChatBtn.addEventListener('click', () => {
            if (chatHistory.length === 0) return;
            if (confirm(`Deseja limpar o histórico do modo ${MODES[currentMode].name}?`)) {
                chatHistory = [];
                localStorage.removeItem('shorye_groq_history_' + currentMode);
                renderChatHistory();
                showToast('Histórico apagado!');
            }
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
            }
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateKeyStatus();
            setMode(currentMode);
        });

        function renderPresets(presets) {
            presetContainer.innerHTML = '';
            presets.forEach(p => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "p-4 rounded-xl bg-zinc-900 border border-zinc-800 hover:border-zinc-600 transition-all text-left group flex flex-col justify-between cursor-pointer";
                btn.addEventListener('click', () => sendPromptText(p.prompt));
                btn.innerHTML = `
                    <div class="text-zinc-400 group-hover:text-white mb-2 transition-colors">
                        <i class="fa-solid ${p.icon} text-base"></i>
                    </div>
                    <div>
                        <h3 class="font-semibold text-xs text-white mb-1">${p.title}</h3>
                        <p class="text-[11px] text-zinc-400 line-clamp-2">${p.prompt}</p>
                    </div>
                `;
                presetContainer.appendChild(btn);
            });
        }

        function renderChatHistory() {
            chatContainer.innerHTML = '';
            if (chatHistory.length === 0) {
                chatContainer.appendChild(welcomeScreen);
                welcomeScreen.classList.remove('hidden');
                return;
            }
            welcomeScreen.classList.add('hidden');
            chatHistory.forEach(msg => {
                appendMessageUI(msg.role, msg.content);
            });
            scrollToBottom();
        }

        function appendMessageUI(role, content) {
            welcomeScreen.classList.add('hidden');
            const isUser = role === 'user';
            const msgDiv = document.createElement('div');
            msgDiv.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} mb-4`;

            const bodyHTML = isUser ? escapeHtml(content) : marked.parse(content);
            const msgId = 'msg-' + Math.random().toString(36).substring(2, 9);
            window[msgId] = content;

            msgDiv.innerHTML = `
                <div class="flex items-start gap-2.5 max-w-[90%] sm:max-w-[85%] ${isUser ? 'flex-row-reverse' : 'flex-row'}">
                    <div class="w-7 h-7 rounded-lg ${isUser ? 'bg-white text-zinc-950 font-bold' : 'bg-zinc-800 text-zinc-200 border border-zinc-700'} flex items-center justify-center flex-shrink-0 text-xs shadow-sm">
                        <i class="fa-solid ${isUser ? 'fa-user' : 'fa-terminal'}"></i>
                    </div>
                    <div class="relative group">
                        <div class="p-3.5 rounded-2xl ${isUser ? 'bg-white text-zinc-950 rounded-tr-none font-medium' : 'bg-zinc-900 border border-zinc-800 text-zinc-100 rounded-tl-none shadow-sm'} text-xs sm:text-sm markdown-body">
                            ${bodyHTML}
                        </div>
                        ${!isUser ? `
                        <button type="button" data-copy-id="${msgId}" class="copy-code-btn absolute -bottom-5 right-1 opacity-0 group-hover:opacity-100 text-zinc-500 hover:text-white text-[11px] transition-opacity p-1 flex items-center gap-1" title="Copiar resposta">
                            <i class="fa-regular fa-copy"></i> Copiar
                        </button>
                        ` : ''}
                    </div>
                </div>
            `;
            chatContainer.appendChild(msgDiv);
            
            // Adiciona evento de clique no botão de copiar recém-criado
            msgDiv.querySelectorAll('.copy-code-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const codeToCopy = window[btn.getAttribute('data-copy-id')];
                    if (codeToCopy) {
                        navigator.clipboard.writeText(codeToCopy).then(() => {
                            showToast('Copiado para a área de transferência!');
                        });
                    }
                });
            });

            scrollToBottom();
        }

        function appendTypingIndicator() {
            const indicatorDiv = document.createElement('div');
            indicatorDiv.id = 'typingIndicator';
            indicatorDiv.className = 'flex items-start gap-2.5 mb-4';
            indicatorDiv.innerHTML = `
                <div class="w-7 h-7 rounded-lg bg-zinc-800 text-zinc-200 border border-zinc-700 flex items-center justify-center flex-shrink-0 text-xs shadow-sm">
                    <i class="fa-solid fa-terminal"></i>
                </div>
                <div class="p-3.5 rounded-2xl bg-zinc-900 border border-zinc-800 rounded-tl-none shadow-sm flex items-center space-x-1.5">
                    <div class="w-1.5 h-1.5 bg-zinc-400 rounded-full dot-1"></div>
                    <div class="w-1.5 h-1.5 bg-zinc-400 rounded-full dot-2"></div>
                    <div class="w-1.5 h-1.5 bg-zinc-400 rounded-full dot-3"></div>
                </div>
            `;
            chatContainer.appendChild(indicatorDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text || isGenerating) return;

            if (!customApiKey) {
                showToast('Insira sua chave API da Groq nas configurações (🔑)!', 'fa-triangle-exclamation text-amber-400');
                keyModal.classList.remove('hidden');
                return;
            }

            appendMessageUI('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            chatHistory.push({ role: 'user', content: text });

            appendTypingIndicator();
            isGenerating = true;
            sendBtn.disabled = true;

            try {
                const responseText = await fetchGroqAPI(chatHistory);
                removeTypingIndicator();
                appendMessageUI('assistant', responseText);
                chatHistory.push({ role: 'assistant', content: responseText });
                localStorage.setItem('shorye_groq_history_' + currentMode, JSON.stringify(chatHistory));
            } catch (err) {
                removeTypingIndicator();
                showToast(err.message, 'fa-triangle-exclamation text-amber-400');
                appendMessageUI('assistant', `⚠️ **Erro de Comunicação:** ${err.message}. Verifique se a sua chave da Groq está correta.`);
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        });

        async function fetchGroqAPI(history) {
            const modeInfo = MODES[currentMode];
            const endpoint = "https://api.groq.com/openai/v1/chat/completions";

            const messages = [
                { role: "system", content: modeInfo.systemInstruction },
                ...history.map(h => ({ role: h.role, content: h.content }))
            ];

            const payload = {
                model: modeInfo.model,
                messages: messages,
                temperature: 0.7
            };

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000);

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${customApiKey}`
                    },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.error?.message || `Erro HTTP (${res.status})`);
                }

                const assistantMessage = data.choices?.[0]?.message?.content;
                if (assistantMessage) {
                    return assistantMessage;
                } else {
                    throw new Error("A resposta da API veio vazia.");
                }
            } catch (err) {
                if (err.name === 'AbortError') {
                    throw new Error("A requisição demorou muito e expirou (Timeout).");
                }
                throw err;
            }
        }

        function updateKeyStatus() {
            if (customApiKey) {
                if(keyStatusDot) keyStatusDot.className = "absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-emerald-500";
            } else {
                if(keyStatusDot) keyStatusDot.className = "absolute -top-0.5 -right-0.5 w-2.5 h-2.5 rounded-full bg-amber-500";
            }
        }

        function showToast(msg, icon = 'fa-check text-emerald-400') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastIcon.className = `fa-solid ${icon}`;
            toastMsg.textContent = msg;

            toast.classList.remove('opacity-0', 'translate-y-4', 'pointer-events-none');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4', 'pointer-events-none');
            }, 3000);
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
